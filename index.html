<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Определяем устройство сразу, до отрисовки: телефон (узкий экран или сенсорный телефон) получает свой интерфейс, ПК и планшет — обычный.
    (function () {
      var d = document.documentElement;
      function sync() {
        var touch = false, small = false;
        try { touch = matchMedia("(pointer: coarse)").matches; small = Math.min(screen.width, screen.height) <= 600; } catch (e) {}
        var mobile = (touch && small) || innerWidth <= 720;
        d.setAttribute("data-device", mobile ? "mobile" : "desktop");
        d.setAttribute("data-touch", touch ? "1" : "0");
      }
      sync();
      addEventListener("resize", sync);
      addEventListener("orientationchange", sync);
    })();
  </script>
  <title>Tsukimi</title>
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800&family=Oswald:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=79">
</head>
